<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="amlaBody" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#CEF06D"/>
      <stop offset="45%" stop-color="#9BC938"/>
      <stop offset="85%" stop-color="#5E8C22"/>
      <stop offset="100%" stop-color="#345412"/>
    </radialGradient>
    <radialGradient id="amlaHighlight" cx="30%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="amlaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#142617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#amlaShadow)">
    <!-- Main Spherical Fruit Body -->
    <circle cx="100" cy="108" r="62" fill="url(#amlaBody)"/>
    <!-- 6 Characteristic Segment Grooves / Ribs -->
    <path d="M100 46 C80 62 72 154 100 170" stroke="#486E18" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M100 46 C120 62 128 154 100 170" stroke="#486E18" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M100 46 C55 70 52 145 100 170" stroke="#486E18" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M100 46 C145 70 148 145 100 170" stroke="#486E18" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M100 46 C40 85 42 135 100 170" stroke="#486E18" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M100 46 C160 85 158 135 100 170" stroke="#486E18" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.4"/>
    <!-- Specular Highlight for Juiciness -->
    <ellipse cx="80" cy="85" rx="36" ry="24" transform="rotate(-30 80 85)" fill="url(#amlaHighlight)"/>
    <!-- Calyx indentation at top -->
    <ellipse cx="100" cy="48" rx="8" ry="4" fill="#2E4810"/>
    <circle cx="100" cy="48" r="3" fill="#1C3008"/>
    <!-- Mini Stem & Attached Herb Leaflets -->
    <path d="M100 48 C99 38 95 24 88 18" stroke="#4A3418" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Small Leaflet Left -->
    <path d="M88 18 C78 14 68 20 62 28 C68 32 78 30 88 20 Z" fill="#75A832" stroke="#486E18" stroke-width="0.8"/>
    <!-- Small Leaflet Right -->
    <path d="M92 24 C102 18 114 20 120 28 C112 32 102 30 92 24 Z" fill="#88BF3B" stroke="#486E18" stroke-width="0.8"/>
  </g>
</svg>