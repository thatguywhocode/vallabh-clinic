<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="chamomileCore" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="85%" stop-color="#D07008"/>
      <stop offset="100%" stop-color="#8C4402"/>
    </radialGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F7F5EF"/>
      <stop offset="100%" stop-color="#DFD9C8"/>
    </linearGradient>
    <filter id="flowerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#142617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#flowerShadow)">
    <!-- 16 Radiating White Petals with natural organic offsets -->
    <!-- Group 1: Background Petals (slightly darker/shadowed) -->
    <g fill="#EAE5D5" stroke="#D5CDB8" stroke-width="0.8">
      <path d="M100 100 C92 70 88 40 100 20 C112 40 108 70 100 100 Z" transform="rotate(22.5 100 100)"/>
      <path d="M100 100 C92 70 88 40 100 20 C112 40 108 70 100 100 Z" transform="rotate(67.5 100 100)"/>
      <path d="M100 100 C92 70 88 40 100 20 C112 40 108 70 100 100 Z" transform="rotate(112.5 100 100)"/>
      <path d="M100 100 C92 70 88 40 100 20 C112 40 108 70 100 100 Z" transform="rotate(157.5 100 100)"/>
      <path d="M100 100 C92 70 88 40 100 20 C112 40 108 70 100 100 Z" transform="rotate(202.5 100 100)"/>
      <path d="M100 100 C92 70 88 40 100 20 C112 40 108 70 100 100 Z" transform="rotate(247.5 100 100)"/>
      <path d="M100 100 C92 70 88 40 100 20 C112 40 108 70 100 100 Z" transform="rotate(292.5 100 100)"/>
      <path d="M100 100 C92 70 88 40 100 20 C112 40 108 70 100 100 Z" transform="rotate(337.5 100 100)"/>
    </g>
    <!-- Group 2: Foreground Pure Petals -->
    <g fill="url(#petalGrad)" stroke="#E5DEC9" stroke-width="0.8">
      <path d="M100 100 C91 68 86 36 100 18 C114 36 109 68 100 100 Z" transform="rotate(0 100 100)"/>
      <path d="M100 100 C91 68 86 36 100 18 C114 36 109 68 100 100 Z" transform="rotate(45 100 100)"/>
      <path d="M100 100 C91 68 86 36 100 18 C114 36 109 68 100 100 Z" transform="rotate(90 100 100)"/>
      <path d="M100 100 C91 68 86 36 100 18 C114 36 109 68 100 100 Z" transform="rotate(135 100 100)"/>
      <path d="M100 100 C91 68 86 36 100 18 C114 36 109 68 100 100 Z" transform="rotate(180 100 100)"/>
      <path d="M100 100 C91 68 86 36 100 18 C114 36 109 68 100 100 Z" transform="rotate(225 100 100)"/>
      <path d="M100 100 C91 68 86 36 100 18 C114 36 109 68 100 100 Z" transform="rotate(270 100 100)"/>
      <path d="M100 100 C91 68 86 36 100 18 C114 36 109 68 100 100 Z" transform="rotate(315 100 100)"/>
    </g>
    <!-- Central Conical Stamen Dome -->
    <circle cx="100" cy="100" r="28" fill="url(#chamomileCore)"/>
    <!-- Textured Stamen Florets / Pollen Stipples -->
    <g fill="#FFF280" opacity="0.8">
      <circle cx="94" cy="92" r="2.2"/>
      <circle cx="106" cy="94" r="2.0"/>
      <circle cx="100" cy="86" r="2.1"/>
      <circle cx="88" cy="100" r="1.8"/>
      <circle cx="100" cy="100" r="2.4"/>
      <circle cx="112" cy="102" r="1.9"/>
      <circle cx="95" cy="108" r="2.1"/>
      <circle cx="106" cy="110" r="2.0"/>
      <circle cx="100" cy="116" r="1.8"/>
      <circle cx="89" cy="109" r="1.6"/>
      <circle cx="113" cy="92" r="1.7"/>
    </g>
  </g>
</svg>