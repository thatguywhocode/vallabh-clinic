<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="tulsiGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#72B063" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3B6938" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#234222" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="tulsiStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#554026"/>
      <stop offset="100%" stop-color="#2C4825"/>
    </linearGradient>
    <filter id="tulsiShadow" x="-20%" y="-20%" width="140%" height="140%">
