    <path d="M100.5 88 C118 80 132 70 146 74" stroke="#90D880" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.55" fill="none"/>
    <path d="M99.8 65 C85 55 75 46 64 48" stroke="#90D880" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5" fill="none"/>
    <path d="M100.2 65 C115 55 125 46 136 48" stroke="#90D880" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5" fill="none"/>
