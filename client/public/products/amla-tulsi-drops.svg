<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Studio Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCFBF8"/>
      <stop offset="50%" stop-color="#F7F5EF"/>
      <stop offset="100%" stop-color="#E9E5D9"/>
    </radialGradient>
    
    <!-- Pedestal Shadow -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(40, 54, 43, 0.28)"/>
      <stop offset="60%" stop-color="rgba(40, 54, 43, 0.08)"/>
      <stop offset="100%" stop-color="rgba(40, 54, 43, 0)"/>
    </radialGradient>

    <!-- Amber Dropper Bottle Gradient -->
    <linearGradient id="amberBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A220F"/>
      <stop offset="20%" stop-color="#7A4B20"/>
      <stop offset="50%" stop-color="#B27538"/>
      <stop offset="80%" stop-color="#6E3F18"/>
      <stop offset="100%" stop-color="#2B1607"/>
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="25%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="75%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.25)"/>
    </linearGradient>

    <!-- Rubber Bulb Gradient -->
    <linearGradient id="rubberBulb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1F1B"/>
      <stop offset="40%" stop-color="#353E37"/>
      <stop offset="60%" stop-color="#4B584E"/>
      <stop offset="100%" stop-color="#151A16"/>
    </linearGradient>

    <!-- Gold/Brass Dropper Collar -->
    <linearGradient id="goldCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#634B19"/>
      <stop offset="30%" stop-color="#B58D3D"/>
      <stop offset="50%" stop-color="#E5C775"/>
      <stop offset="70%" stop-color="#A57E32"/>
      <stop offset="100%" stop-color="#4F3B10"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Pedestal Shadow -->
  <ellipse cx="400" cy="670" rx="230" ry="36" fill="url(#shadowGrad)"/>
  <ellipse cx="400" cy="662" rx="150" ry="20" fill="rgba(28, 37, 30, 0.22)"/>

  <!-- DROPPER ASSEMBLY -->
  <!-- Rubber Squeeze Bulb -->
  <path d="M365 130 C365 95 380 75 400 75 C420 75 435 95 435 130 Z" fill="url(#rubberBulb)"/>
  <ellipse cx="400" cy="130" rx="35" ry="10" fill="#2C352E"/>

  <!-- Gold Dropper Ring / Collar -->
  <rect x="360" y="136" width="80" height="50" rx="6" fill="url(#goldCollar)"/>
  <line x1="362" y1="148" x2="438" y2="148" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <line x1="362" y1="172" x2="438" y2="172" stroke="rgba(0,0,0,0.3)" stroke-width="2"/>

  <!-- Glass Pipette Tip visible above bottle neck -->
  <rect x="382" y="186" width="36" height="34" rx="4" fill="rgba(255,255,255,0.4)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>

  <!-- BOTTLE BODY -->
  <!-- Bottle Neck -->
  <rect x="355" y="215" width="90" height="40" rx="6" fill="url(#amberBottle)"/>
  <rect x="345" y="240" width="110" height="18" rx="6" fill="url(#amberBottle)"/>

  <!-- Bottle Shoulder &amp; Cylinder -->
  <path d="M345 255 C310 265 285 300 285 340 L285 620 C285 645 305 655 330 655 L470 655 C495 655 515 645 515 620 L515 340 C515 300 490 265 455 255 Z" fill="url(#amberBottle)"/>
  <path d="M345 255 C310 265 285 300 285 340 L285 620 C285 645 305 655 330 655 L470 655 C495 655 515 645 515 620 L515 340 C515 300 490 265 455 255 Z" fill="url(#glassReflection)"/>

  <!-- APOTHECARY LABEL -->
  <rect x="305" y="340" width="190" height="275" rx="8" fill="#FAF8F3" stroke="#D8D2C2" stroke-width="1.5"/>
  <rect x="312" y="347" width="176" height="261" rx="5" fill="none" stroke="#49614D" stroke-width="1.2" stroke-dasharray="6 3"/>

  <!-- Brand Banner -->
  <rect x="320" y="360" width="160" height="28" rx="4" fill="#49614D"/>
  <text x="400" y="379" font-family="'Cormorant Garamond', Georgia, serif" font-size="13" font-weight="700" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">VALLABH CLINIC</text>

  <!-- Botanical Emblem: Amla Berry &amp; Tulsi Leaf -->
  <circle cx="400" cy="418" r="19" fill="#F4F6F4" stroke="#49614D" stroke-width="1.5"/>
  <!-- Leaf icon -->
  <path d="M400 405 C392 405 388 412 388 420 C388 428 400 432 400 432 C400 432 412 428 412 420 C412 412 408 405 400 405 Z" fill="#49614D" fill-opacity="0.25" stroke="#49614D" stroke-width="1.5"/>
  <circle cx="400" cy="419" r="4" fill="#E83F35"/>

  <!-- Product Title -->
  <text x="400" y="460" font-family="'Cormorant Garamond', Georgia, serif" font-size="17" font-weight="700" fill="#1C251E" text-anchor="middle">WILD AMLA &amp; TULSI</text>
  <text x="400" y="478" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="1.2" fill="#E83F35" text-anchor="middle">C-IMMUNE DROPS</text>

  <line x1="335" y1="492" x2="465" y2="492" stroke="#CBD5CD" stroke-width="1"/>
  <text x="400" y="508" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#5D4F3F" text-anchor="middle">Organic Indian Gooseberry</text>
  <text x="400" y="522" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#5D4F3F" text-anchor="middle">&amp; Krishna Tulsi Concentrate</text>

  <!-- Volume Badge -->
  <rect x="345" y="540" width="110" height="22" rx="11" fill="#F4F6F4" stroke="#49614D" stroke-width="1"/>
  <text x="400" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#28362B" text-anchor="middle">50ml DROPPER</text>

  <text x="400" y="586" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" letter-spacing="0.8" fill="#7A6E5F" text-anchor="middle">NON-PRESCRIPTION ESSENTIAL</text>

  <!-- Bottle Specular Reflections -->
  <rect x="294" y="340" width="10" height="290" rx="5" fill="rgba(255,255,255,0.22)"/>
  <rect x="309" y="350" width="4" height="270" rx="2" fill="rgba(255,255,255,0.12)"/>
</svg>