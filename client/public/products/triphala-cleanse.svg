<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Studio Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCFBF8"/>
      <stop offset="50%" stop-color="#F7F5EF"/>
      <stop offset="100%" stop-color="#E9E5D9"/>
    </radialGradient>
    
    <!-- Pedestal Shadow -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(40, 54, 43, 0.28)"/>
      <stop offset="60%" stop-color="rgba(40, 54, 43, 0.08)"/>
      <stop offset="100%" stop-color="rgba(40, 54, 43, 0)"/>
    </radialGradient>

    <!-- Amber Glass Gradient -->
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D2612"/>
      <stop offset="15%" stop-color="#6B4423"/>
      <stop offset="45%" stop-color="#9E6938"/>
      <stop offset="70%" stop-color="#5E381A"/>
      <stop offset="100%" stop-color="#2E1B0B"/>
    </linearGradient>

    <!-- Glass Highlight -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.2)"/>
    </linearGradient>

    <!-- Lid Metallic Gradient -->
    <linearGradient id="lidMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F2820"/>
      <stop offset="25%" stop-color="#3E5241"/>
      <stop offset="50%" stop-color="#6B856F"/>
      <stop offset="75%" stop-color="#3E5241"/>
      <stop offset="100%" stop-color="#1A221B"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Studio Pedestal Circle -->
  <ellipse cx="400" cy="650" rx="280" ry="42" fill="url(#shadowGrad)"/>
  <ellipse cx="400" cy="640" rx="190" ry="24" fill="rgba(28, 37, 30, 0.22)"/>

  <!-- JAR BODY -->
  <!-- Neck -->
  <rect x="290" y="240" width="220" height="40" rx="8" fill="url(#amberGlass)"/>
  
  <!-- Main Jar Cylinder -->
  <rect x="240" y="270" width="320" height="360" rx="36" fill="url(#amberGlass)"/>
  <rect x="240" y="270" width="320" height="360" rx="36" fill="url(#glassReflection)"/>

  <!-- METAL SCREW LID -->
  <rect x="270" y="160" width="260" height="86" rx="14" fill="url(#lidMetal)"/>
  <!-- Lid Ridges -->
  <line x1="290" y1="164" x2="290" y2="242" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <line x1="330" y1="164" x2="330" y2="242" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <line x1="370" y1="164" x2="370" y2="242" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <line x1="400" y1="164" x2="400" y2="242" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  <line x1="430" y1="164" x2="430" y2="242" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <line x1="470" y1="164" x2="470" y2="242" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <line x1="510" y1="164" x2="510" y2="242" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>

  <!-- APOTHECARY PAPER LABEL -->
  <rect x="260" y="310" width="280" height="290" rx="10" fill="#FAF8F3" stroke="#D8D2C2" stroke-width="1.5"/>
  <!-- Decorative Label Borders -->
  <rect x="268" y="318" width="264" height="274" rx="6" fill="none" stroke="#49614D" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Top Brand Banner in Botanical Green -->
  <rect x="280" y="334" width="240" height="34" rx="4" fill="#49614D"/>
  <text x="400" y="357" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-weight="700" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">VALLABH CLINIC</text>

  <!-- Vermilion Botanical Emblem -->
  <circle cx="400" cy="402" r="22" fill="#FEF2F1" stroke="#E83F35" stroke-width="1.5"/>
  <path d="M400 388 C392 388 386 394 386 402 C386 410 392 414 400 417 C408 414 414 410 414 402 C414 394 408 388 400 388 Z" fill="#E83F35" fill-opacity="0.25" stroke="#E83F35" stroke-width="1.5"/>
  <line x1="400" y1="392" x2="400" y2="413" stroke="#E83F35" stroke-width="1.5"/>

  <!-- Product Title -->
  <text x="400" y="446" font-family="'Cormorant Garamond', Georgia, serif" font-size="21" font-weight="700" fill="#1C251E" text-anchor="middle">TRIPHALA CLEANSE</text>
  <text x="400" y="466" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#49614D" text-anchor="middle">&amp; GUT HARMONIZER</text>

  <!-- Ingredients Line -->
  <line x1="310" y1="482" x2="490" y2="482" stroke="#CBD5CD" stroke-width="1"/>
  <text x="400" y="500" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#5D4F3F" text-anchor="middle">Amalaki &#8226; Haritaki &#8226; Bibhitaki</text>
  <text x="400" y="516" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#5D4F3F" text-anchor="middle">Standardized Ayurvedic Phyto-Extract</text>

  <!-- Seal / Weight -->
  <rect x="330" y="534" width="140" height="26" rx="13" fill="#F4F6F4" stroke="#49614D" stroke-width="1"/>
  <text x="400" y="551" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#28362B" text-anchor="middle">NET WT. 100g POWDER</text>

  <text x="400" y="582" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" letter-spacing="1" fill="#7A6E5F" text-anchor="middle">NON-PRESCRIPTION OTC &#8226; 100% PURE</text>

  <!-- Specular Vertical Highlights on Jar Glass -->
  <rect x="252" y="280" width="14" height="340" rx="7" fill="rgba(255,255,255,0.22)"/>
  <rect x="274" y="290" width="6" height="320" rx="3" fill="rgba(255,255,255,0.14)"/>
</svg>